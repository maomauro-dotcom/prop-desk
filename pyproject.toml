[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propdesk"
version = "0.1.0"
description = "Paper trading desk for CME micro index futures (MNQ/MES). Live routing disabled."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "httpx>=0.27",
  "anthropic>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["propdesk*", "backend*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
