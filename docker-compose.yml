# Paper only. TRADOVATE_ENABLED / IB_ENABLED do not route orders in this version.
services:
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/propdesk.db
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - propdesk-data:/data
  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  propdesk-data:
